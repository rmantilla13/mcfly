# McFly for iPhone and Mac: one app target that builds for both.
# `xcodegen generate` (in apple/) writes McFly.xcodeproj. Secrets and the team
# come from Config/*.xcconfig; see README.md.
name: McFly
options:
  bundleIdPrefix: com.bot
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
settings:
  base:
    ORGANIZATIONNAME: McFly
    SWIFT_VERSION: "5.0"
packages:
  McFlyKit:
    path: McFlyKit
  # The Kokoro voice, apart from the kit so its tests and CI skip the models.
  McFlyVoice:
    path: McFlyVoice
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.30.0
targets:
  McFly:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: McFly
        excludes:
          - "*.entitlements"
    dependencies:
      - package: McFlyKit
        product: McFlyKit
      - package: McFlyVoice
        product: McFlyVoice
      - package: Supabase
        product: Supabase
    info:
      path: McFly/Info.plist
      properties:
        CFBundleDisplayName: McFly
        CFBundleName: McFly
        # From the build settings, so release-ios.sh's build number reaches
        # the app (xcodegen writes 1.0 and 1 otherwise).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: Copyright © McFly. All rights reserved.
        LSApplicationCategoryType: public.app-category.productivity
        # Standard HTTPS only, so App Store Connect skips the export question.
        ITSAppUsesNonExemptEncryption: false
        # The mark, centred at its own size (scripts/render_launch_mark.py).
        # RootView draws it in the same place until the app knows where to go.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan the pairing code on your McFly display.
        NSMicrophoneUsageDescription: Talk to McFly instead of typing.
        NSSpeechRecognitionUsageDescription: Turn what you say to McFly into text, on this device.
        NSLocationWhenInUseUsageDescription: Show today's weather where you are on Home. Only your approximate location is used, for the forecast.
        # Filled from Config/Signing.xcconfig (Local.xcconfig overrides).
        SupabaseURL: "$(SUPABASE_URL)"
        SupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
        # mcfly://auth-callback (email links) and mcfly://pair?code=123456.
        # The https://mcfly.bot/pair link is the associated domain in the entitlements.
        CFBundleURLTypes:
          - CFBundleURLName: com.bot.mcfly
            CFBundleURLSchemes: [mcfly]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: McFly
        PRODUCT_BUNDLE_IDENTIFIER: "$(MCFLY_BUNDLE_ID)"
        DEVELOPMENT_TEAM: "$(MCFLY_TEAM_ID)"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # One target, two entitlements files: the Mac one adds the sandbox.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": McFly/McFly-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": McFly/McFly-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
# A shared scheme, so `xcodebuild -scheme McFly` works on a fresh checkout.
schemes:
  McFly:
    build:
      targets:
        McFly: all
    run:
      config: Debug
    archive:
      config: Release
