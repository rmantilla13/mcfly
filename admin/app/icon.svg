<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The McFly mark: the flux capacitor's Y, as components/Brand.tsx and
       display/qml/components/FluxMark.qml draw it (fractions of the side x 64). -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="16.64"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30323A"/><stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="a1" x1="12.05" y1="22.4" x2="24.24" y2="29.44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B7CF5"/><stop offset="1" stop-color="#B5C4FA"/>
    </linearGradient>
    <linearGradient id="a2" x1="51.95" y1="22.4" x2="39.76" y2="29.44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F07F5A"/><stop offset="1" stop-color="#F8C5B5"/>
    </linearGradient>
    <linearGradient id="a3" x1="32" y1="56.96" x2="32" y2="42.88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6B94A"/><stop offset="1" stop-color="#FBE0AE"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.84"/></filter>
    <filter id="c" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5.12"/></filter>
  </defs>
  <g clip-path="url(#tile)" stroke-linecap="round" stroke-width="7.68">
    <rect width="64" height="64" fill="url(#bg)"/>
    <g filter="url(#g)">
      <path d="M24.24 29.44 12.05 22.4" stroke="#5B7CF5"/>
      <path d="M39.76 29.44 51.95 22.4" stroke="#F07F5A"/>
      <path d="M32 42.88v14.08" stroke="#F6B94A"/>
    </g>
    <path d="M24.24 29.44 12.05 22.4" stroke="url(#a1)"/>
    <path d="M39.76 29.44 51.95 22.4" stroke="url(#a2)"/>
    <path d="M32 42.88v14.08" stroke="url(#a3)"/>
    <circle cx="32" cy="33.92" r="4.8" fill="#fff" filter="url(#c)"/>
    <circle cx="32" cy="33.92" r="4.8" fill="#fff"/>
  </g>
</svg>
